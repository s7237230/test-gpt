openapi: 3.1.0
info:
  title: Webhook Forwarder API 1
  description: שליחת JSON לכל Webhook
  version: '1.0.0'
servers:
  - url: https://oz-gpt-forwarder.onrender.com
paths:
  /forward:
    post:
      summary: שליחת נתוני JSON ל־Webhook
      operationId: forwardWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - table
                - row_data
              properties:
                action:
                  type: string
                  example: insert_row
                table:
                  type: string
                  example: DB MASTER
                row_data:
                  type: object
                  additionalProperties:
                    type: string
                  example:
                    "1": "יוסי לוי"
                    "2": "050-1234567"
                    "3": "טלפון"
                    "4": "מתעניין בקנייה"
                    "5": "חם"
                    "6": "לחזור אליו"
                    "7": "פיילוט"
                    "8": "yes"
                    "9": "2025-04-13"
